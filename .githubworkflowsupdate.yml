name: Portfolio 每日自動更新

on:
  schedule:
    # 台灣時間 14:30 = UTC 06:30，週一到週五
    - cron: '30 6 * * 1-5'
  workflow_dispatch:   # 允許手動觸發

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 允許推送更新後的 HTML

    steps:
      # 1. 取得程式碼
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 設定 Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. 安裝依賴
      - name: Install dependencies
        run: pip install yfinance beautifulsoup4

      # 4. 更新股價 → portfolio_radar_v3.html
      - name: Update stock prices
        run: |
          cd updater
          python update_prices.py
        env:
          PYTHONPATH: ${{ github.workspace }}

      # 5. 同步 DCA CSV → dca_tracker.html
      - name: Sync DCA data
        run: python sync_dca.py
        continue-on-error: true

      # 6. 提交並推送
      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/portfolio_radar_v3.html
          git add dashboard/dca_tracker.html
          git add logs/ || true
          git diff --staged --quiet || \
            git commit -m "🤖 $(TZ='Asia/Taipei' date '+%Y/%m/%d %H:%M') 自動更新"
          git push
